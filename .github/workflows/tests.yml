name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/run.js
